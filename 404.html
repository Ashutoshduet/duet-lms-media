<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUET STEM</title>
<script>
// The LMS lesson videos, walkthroughs and pictures moved to duetpower.in/lms/media/library/ (a full backup stays on the
// media-archive branch). An old link to one of them lands here and goes straight to the same file on duetpower.in.
(function () {
  var p = location.pathname, base = '/duet-lms-media/';
  if (p.indexOf(base) !== 0) return;
  var r = p.slice(base.length);
  if (/^(assets\/|walkthrough\/|[^\/]+\.mp4$)/.test(r)) location.replace('https://duetpower.in/lms/media/library/' + r + location.search + location.hash);
})();
</script>
