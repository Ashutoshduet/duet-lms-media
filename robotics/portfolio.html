<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robotics portfolio · DUET STEM</title>
<meta name="description" content="A student's robotics portfolio from DUET STEM Robotics Lab 360: projects, stars, skills and a certificate.">
<meta name="theme-color" content="#0b0e13">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Noto Sans Devanagari";font-weight:400;font-display:swap;src:url(fonts/nsd-latin-400.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:"Noto Sans Devanagari";font-weight:700;font-display:swap;src:url(fonts/nsd-latin-700.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:"Noto Sans Devanagari";font-weight:400;font-display:swap;src:url(fonts/nsd-deva-400.woff2) format("woff2");unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:"Noto Sans Devanagari";font-weight:700;font-display:swap;src:url(fonts/nsd-deva-700.woff2) format("woff2");unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
:root{color-scheme:dark;--line:rgba(255,255,255,.1);--mute:#a39c90}
*{box-sizing:border-box}html,body{margin:0;background:#0b0e13;color:#f2ede4;font-family:"Noto Sans Devanagari",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}header img{height:18px}header .sp{flex:1}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:10px;padding:3px}.seg button{border:0;background:none;color:var(--mute);padding:6px 10px;border-radius:8px;font:600 13px inherit;cursor:pointer}.seg button.on{background:#f2ede4;color:#12100c}
#main{max-width:820px;margin:0 auto;padding:20px 16px 50px}h2{margin:0;font-size:26px}h3{margin:22px 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}html[lang=hi] h3{letter-spacing:0}
.mute{color:var(--mute);font-size:14px;line-height:1.5}.stars{color:#ffd76a;white-space:nowrap}a{color:#7fd1ff;font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.tile{background:rgba(255,255,255,.05);border-radius:12px;padding:12px;text-align:center}.tile b{display:block;font-size:24px}.tile span{font-size:12.5px;color:var(--mute)}
.sk-skill{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr auto;gap:8px;align-items:center;font-size:13.5px;padding:3px 0}.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7fd1ff,#9fd17a)}.lv{font-size:11.5px;font-weight:700;color:#9fd17a}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.btn{padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px;background:rgba(255,255,255,.09);border:0;color:#f2ede4;cursor:pointer;margin:6px 6px 0 0}.btn.pri{background:#f0a65a;color:#14100a}
canvas.cert{width:100%;height:auto;border-radius:8px;margin-top:10px;display:block}
</style>
</head>
<body>
<header><img src="brand/duet-stem-logo-light.png" alt="DUET STEM"><b>Robotics Lab 360</b><span class="sp"></span><div id="langs" class="seg"><button data-l="en">EN</button><button data-l="hi">हिंदी</button><button data-l="hg">Hinglish</button></div></header>
<main id="main"></main>
<script type="module" src="js/portfolio.js"></script>
</body>
</html>
