<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher dashboard · Robotics Lab 360</title>
<meta name="description" content="DUET STEM Robotics Lab 360: classes, assignments, live results, report cards, certificates and the principal's school view. Works online and without the internet.">
<meta name="theme-color" content="#0b0e13">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:"Noto Sans Devanagari";font-weight:400;font-display:swap;src:url(fonts/nsd-latin-400.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:"Noto Sans Devanagari";font-weight:600;font-display:swap;src:url(fonts/nsd-latin-600.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:"Noto Sans Devanagari";font-weight:700;font-display:swap;src:url(fonts/nsd-latin-700.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF}
@font-face{font-family:"Noto Sans Devanagari";font-weight:400;font-display:swap;src:url(fonts/nsd-deva-400.woff2) format("woff2");unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:"Noto Sans Devanagari";font-weight:600;font-display:swap;src:url(fonts/nsd-deva-600.woff2) format("woff2");unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:"Noto Sans Devanagari";font-weight:700;font-display:swap;src:url(fonts/nsd-deva-700.woff2) format("woff2");unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:"Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
:root{color-scheme:dark;--bg:#0b0e13;--panel:#121722;--line:rgba(255,255,255,.1);--ink:#f2ede4;--mute:#a39c90;--txt:#e0dacd;--acc:#f0a65a;--blue:#7fd1ff;--green:#9fd17a;--red:#ff8a7a;--mono:"Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(11,14,19,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);flex-wrap:wrap}
header img{height:18px}header h1{font-size:17px;margin:0;font-weight:700}header .sp{flex:1}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mute)}.seg button.on{background:var(--ink);color:#12100c}
header a{color:var(--blue);font-weight:700;font-size:14px;text-decoration:none}
.btn{padding:8px 13px;border-radius:10px;font-weight:700;font-size:14px;background:rgba(255,255,255,.09);border:0;color:var(--ink);white-space:nowrap}.btn:hover{background:rgba(255,255,255,.15)}.btn.pri{background:var(--acc);color:#14100a}.btn.sm{padding:5px 9px;font-size:12.5px}.btn:disabled{opacity:.5}
#main{display:flex;min-height:calc(100vh - 60px)}
#cls{width:230px;flex:none;padding:14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#cls .cl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:9px 11px;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.04)}#cls .cl span{font-family:var(--mono);font-size:12px;color:var(--mute)}#cls .cl.on{border-color:rgba(240,166,90,.6);background:rgba(240,166,90,.12)}
#pane{flex:1;min-width:0;padding:18px 22px 40px}#pane.full{max-width:1100px;margin:0 auto}
#pane h2{margin:0;font-size:22px}#pane h3{margin:20px 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}html[lang=hi] #pane h3{letter-spacing:0}
.mute{color:var(--mute);font-size:13.5px}.ok{color:var(--green)}.bad{color:var(--red)}.stars{color:#ffd76a;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.code-big{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:.12em;padding:6px 16px;border-radius:12px;background:#06080b;color:#9ff0b0;border:1px solid rgba(159,240,176,.3)}
.card{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}table.grid th,table.grid td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}table.grid th{color:var(--mute);font-size:12px;background:rgba(255,255,255,.03);position:sticky;top:0}
tr.click{cursor:pointer}tr.click:hover{background:rgba(255,255,255,.04)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}ol{margin:0;padding-left:22px;line-height:1.8;font-size:14px}
.empty{padding:40px;text-align:center;color:var(--mute)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}.kpi .tile{background:rgba(255,255,255,.05);border-radius:12px;padding:12px;text-align:center}.kpi .tile b{display:block;font-size:26px}.kpi .tile span{font-size:12.5px;color:var(--mute)}
input,select{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:9px 10px;font-size:15px}
.picks{max-height:44vh;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px;margin:6px 0;padding:6px;border:1px solid var(--line);border-radius:10px}
.pk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:5px 6px;border-radius:7px}.pk:hover{background:rgba(255,255,255,.05)}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;transition:.3s;z-index:60;padding:10px 16px;border-radius:12px;background:#1a2130;border:1px solid var(--line);font-size:14px;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){#main{flex-direction:column}#cls{width:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow:auto}#cls .cl{flex:none}#pane{padding:14px}.two{grid-template-columns:1fr}.code-big{font-size:24px}}
@media print{header,#cls,.row{display:none}}
</style>
</head>
<body>
<header><img src="brand/duet-stem-logo-light.png" alt="DUET STEM"><h1 data-t="title">Teacher dashboard</h1>
  <div id="tabs" class="seg"><button data-tab="classes" data-t="classes">My classes</button><button data-tab="principal" data-t="principal">Principal</button></div>
  <span class="sp"></span><div id="langs" class="seg"><button data-l="en">EN</button><button data-l="hi">हिंदी</button><button data-l="hg">Hinglish</button></div><a href="index.html" data-t="lab">Open the lab →</a></header>
<div id="main"></div>
<div id="toast"></div>
<script type="module" src="js/teacher.js"></script>
</body>
</html>
